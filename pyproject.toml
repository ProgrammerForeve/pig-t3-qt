[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pig-t3"
version = "2.4.0"
authors = [
    {name = "Loki", email = "gosoftware2025@gmail.com"},
]
description = "AI Context Generator & Patcher with GUI – analyse, patch and optimise codebases via local LLMs"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "sqlite-vec>=0.1.6",
    "rank-bm25>=0.2.2",
    "watchdog>=4.0",
    "requests",
    "radon",
    "pylint",
    "vulture",
    "bandit",
    "Pillow",
    "majorchik-api",
    "networkx>=3.1",
    "ruff>=0.17.4",
    "pyside6>=6.6.3.1",
    "qt-material>=2.17",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0",
    "pytest-qt>=4.4.0",
    "pytest-timeout>=2.4.0",
]
rag = [
    "sentence-transformers>=3.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/pig-t3"
Issues = "https://github.com/yourusername/pig-t3/issues"

[project.scripts]
pig-t3 = "PIG_T3.main:main"

[tool.setuptools]
packages = [
    "PIG_T3",
    "PIG_T3.core",
    "PIG_T3.core.quality",
    "PIG_T3.utils",
]
include-package-data = true

[tool.setuptools.package-data]
PIG_T3 = ["logo.png", "icon.png"]

# ============================================================
#  Ruff — линтер + форматтер (заменяет flake8, black, isort)
# ============================================================
[tool.ruff]
target-version = "py38"
line-length = 120
fix = true

exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".hg", ".mypy_cache",
    ".nox", ".pytest_cache", ".ruff_cache", ".svn", ".tox",
    ".venv", "venv", "__pypackages__", "_build", "build", "dist",
    "*.egg-info",
    # артефакты самого PIG-T3, появляющиеся в тестовых проектах
    ".pig", ".pig_cache", "pig_plan_log.txt",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle (стиль)
    "F",    # Pyflakes (ошибки)
    "W",    # pycodestyle (предупреждения)
    "I",    # isort (сортировка импортов)
    "UP",   # pyupgrade (устаревший синтаксис)
    "B",    # flake8-bugbear (потенциальные баги)
    "SIM",  # flake8-simplify (упрощение кода)
    "S",    # flake8-bandit (безопасность)
    "RUF",  # специфичные для Ruff
    "T20",  # flake8-print (T201 = print found)
]

ignore = [
    "E501",   # длина строки (контролируется line-length)
    "B008",   # вызов функции в аргументе по умолчанию (часто в tkinter)
    "S101",   # assert (GUI-приложение использует их редко, но не критично)
    "S311",   # random не для криптографии — OK для GUI
    "RUF001", # неоднозначные unicode-символы (в русских строках)
    "RUF002", # то же для docstring
    "RUF003", # то же для комментариев
    # --- Добавлено для нового gui_qt ---
    "S108",   # /tmp/... в тестовых фейках (не реальные temp-файлы)
    "S603",   # subprocess для radon/pylint/bandit/git — осознанный выбор
    "S607",   # partial executable path (git, python -m radon) — резолвится через PATH
    "S602",   # shell=True в run_command — opt-in, см. ADR-012
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["S101", "E402"]
# tests могут печатать для отладки — T201 только для PIG_T3
"tests/**/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["PIG_T3"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 88

# ============================================================
#  mypy — статическая проверка типов (опционально)
# ============================================================
[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
exclude = [
    "^build/",
    "^dist/",
    "^\\.venv/",
    "^venv/",
]

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "pyinstaller>=6.22.3",
    "pytest-cov>=5.0.0",
    "pytest-qt>=4.4.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --timeout=60 --timeout-method=thread"
markers = [
    "threading: тесты, работающие с QThread",
    "slow: долгие тесты (>1 сек)",
]
filterwarnings = [
    "error::DeprecationWarning:PIG_T3.*",
]

[tool.coverage.run]
source = ["PIG_T3"]
omit = [
    "PIG_T3/__main__.py",
    "PIG_T3/gui_qt/app.py",           # bootstrap, покрывается smoke вручную
    "PIG_T3/gui_qt/theme.py",         # Qt-Material, тестируется визуально
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pig-t3"
version = "1.1.3"
authors = [
    {name = "Loki", email = "gosoftware2025@gmail.com"},
]
description = "AI Context Generator & Patcher with GUI – analyse, patch and optimise codebases via local LLMs"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "requests",
    "radon",
    "pylint",
    "vulture",
    "bandit",
    "Pillow",
    "majorchik-api",
]

[project.urls]
Homepage = "https://github.com/yourusername/pig-t3"
Issues = "https://github.com/yourusername/pig-t3/issues"

[project.scripts]
pig-t3 = "PIG_T3.main:main"

[tool.setuptools]
packages = ["PIG_T3", "PIG_T3.core", "PIG_T3.core.quality", "PIG_T3.gui", "PIG_T3.gui.tabs", "PIG_T3.utils"]
include-package-data = true

[tool.setuptools.package-data]
PIG_T3 = ["logo.png", "icon.png"]

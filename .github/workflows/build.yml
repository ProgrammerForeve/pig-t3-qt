name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: PIG-T3-linux
            binary_path: dist/PIG-T3
          - os: windows-2022
            artifact_name: PIG-T3-windows
            binary_path: dist/PIG-T3.exe

    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install system deps (Linux Qt)
        if: runner.os == 'Linux'
        run: |
          # Быстрый skip если уже стоит (ubuntu-24.04 runner содержит
          # большую часть Qt deps из коробки)
          missing=""
          for pkg in libgl1 libegl1 libxkbcommon-x11-0; do
            if ! dpkg -s "$pkg" > /dev/null 2>&1; then
              missing="$missing $pkg"
            fi
          done
          if [ -z "$missing" ]; then
            echo "Qt deps already installed, skipping apt"
            exit 0
          fi
          echo "Missing: $missing"

          # 5 попыток с 60s backoff — flaky DNS на azure.archive.ubuntu.com
          # обычно восстанавливается за 1-3 минуты
          for i in 1 2 3 4 5; do
            echo "=== apt attempt $i/5 ==="
            if sudo apt-get update --fix-missing && \
               sudo apt-get install -y --fix-missing $missing; then
              echo "apt OK on attempt $i"
              exit 0
            fi
            if [ "$i" -lt 5 ]; then
              echo "attempt $i failed, retry in 60s"
              sleep 60
            fi
          done
          echo "ERROR: apt failed after 5 attempts"
          exit 1

      - name: Install project deps
        run: uv sync --extra dev

      - name: Run tests (Linux, before build)
        if: runner.os == 'Linux'
        run: uv run pytest tests/ -q --timeout=60

      - name: Build executable
        run: uv run pyinstaller pig_t3.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error
